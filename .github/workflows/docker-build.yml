name: "Docker build"

on:
  workflow_dispatch:
    inputs:
      path:
        description: 'Path to docker folder'
        required: true
        type: string
      image:
        description: 'Image name (without dcr.nodes.garden)'
        required: true
        type: string
      tag:
        description: 'Tag name (starting with v)'
        required: true
        type: string
      platforms:
        description: 'Platforms to build for'
        required: true
        type: string
        default: 'linux/amd64,linux/arm64'

jobs:
  build-push:
    runs-on: gha-runner-scale-set-k8s-v2
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER__REGISTRY }}
          username: ${{ secrets.DOCKER__USERNAME }}
          password: ${{ secrets.DOCKER__PASSWORD }}
      - name: Login to GCP registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.GCP_ARTIFACT_REGISTRY_URL }}
          username: _json_key_base64
          password: ${{ secrets.GCP_ARTIFACT_REGISTRY_KEY }}
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          push: true
          context: ${{ inputs.path }}
          platforms: ${{ inputs.platforms }}
          tags: >
            ${{ vars.DOCKER__REGISTRY }}/${{ inputs.image }}:${{ inputs.tag }},
            ${{ vars.GCP_ARTIFACT_REGISTRY_URL }}/${{ inputs.image }}:${{ inputs.tag }}
          cache-from: type=registry,ref=${{ vars.GCP_ARTIFACT_REGISTRY_URL }}/${{ inputs.image }}:cache
          cache-to: type=registry,ref=${{ vars.GCP_ARTIFACT_REGISTRY_URL }}/${{ inputs.image }}:cache,compression=zstd,mode=max