name: "Docker build"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (starting with v)'
        required: true
        type: string
      platforms:
        description: 'Platforms to build for'
        required: true
        type: string
        default: 'linux/amd64'

jobs:
  build-push:
    runs-on: gha-runner-scale-set-k8s-v2
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GCP registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.GCP_ARTIFACT_REGISTRY_URL }}
          username: _json_key_base64
          password: ${{ secrets.GCP_ARTIFACT_REGISTRY_KEY }}
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          platforms: ${{ inputs.platforms }}
          tags: ${{ vars.GCP_ARTIFACT_REGISTRY_URL }}/node-dawn-validator:${{ inputs.tag }}
          cache-from: type=registry,ref=${{ vars.GCP_ARTIFACT_REGISTRY_URL }}/node-dawn-validator:cache
          cache-to: type=registry,ref=${{ vars.GCP_ARTIFACT_REGISTRY_URL }}/node-dawn-validator:cache,compression=zstd,mode=max
